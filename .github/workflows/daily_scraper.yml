name: Unesa News Scraper & Auto-Sync

on:
  schedule:
    # Menjalankan otomatis 2 kali sehari: Jam 00:00 UTC (07:00 WIB) dan Jam 09:00 UTC (16:00 WIB)
    - cron: '0 0,9 * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan skrip secara manual kapan saja dari web GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas playwright
          playwright install chromium

      - name: Run Scraper Script
        run: |
          python local_scraper.py
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rekap_berita_unesa.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update rekap berita unesa [skip ci]" && git push)
