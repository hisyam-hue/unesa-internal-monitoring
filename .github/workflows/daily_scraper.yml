name: Otomatisasi Monitoring Berita Internal UNESA

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas jinja2 playwright

    - name: Install Playwright Browsers
      run: |
        playwright install chromium --with-deps

    - name: Run Internal News Scraper
      run: |
        python local_scraper.py

    - name: Generate Internal Dashboard HTML
      run: |
        python generate_dashboard_internal.py

    - name: Commit & Push Updated Files
      run: |
        git config --global user.name "UNESA Internal Monitoring Bot"
        git config --global user.email "bot@unesa.ac.id"
        git add .
        git commit -m "Auto-update data berita internal & dashboard [skip ci]" || exit 0
        git push
